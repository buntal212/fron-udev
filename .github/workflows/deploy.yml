name: Deploy UDEV PWA

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: udev-pwa-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy UDEV PWA

    runs-on:
      - self-hosted
      - Linux
      - X64
      - frontend-udev

    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      NODE_ENV: production
      VITE_API_URL: https://apiudev.udumbara.my.id
      DEPLOY_PATH: /www/wwwroot/udev.udumbara.my.id

    steps:
      # ========================================
      # 1. CHECKOUT SOURCE CODE
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ========================================
      # 2. SETUP NODE.JS
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ========================================
      # 3. INSTALL DEPENDENCIES
      # ========================================
      - name: Install dependencies
        run: npm ci

      # ========================================
      # 4. BUILD QUASAR PWA
      # ========================================
      - name: Build Quasar PWA
        run: npm run build -- -m pwa
        env:
          NODE_ENV: production
          VITE_API_URL: https://apiudev.udumbara.my.id

      # ========================================
      # 5. VALIDATE BUILD
      # ========================================
      - name: Validate PWA build
        run: |
          set -euo pipefail

          test -f dist/pwa/index.html
          test -d dist/pwa/assets

          echo "PWA build validation successful"

          ls -lah dist/pwa/

      # ========================================
      # 6. PREPARE DEPLOYMENT
      # ========================================
      - name: Prepare deployment directory
        run: |
          set -euo pipefail

          mkdir -p "$DEPLOY_PATH"

          test -w "$DEPLOY_PATH"

          echo "Deployment directory ready"

      # ========================================
      # 7. DEPLOY PWA
      # ========================================
      - name: Deploy PWA to HOMELAB
        run: |
          set -euo pipefail

          rsync -r \
            --delete \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='.htaccess' \
            --exclude='.releases/' \
            --no-perms \
            --no-owner \
            --no-group \
            dist/pwa/ "$DEPLOY_PATH/"

          test -f "$DEPLOY_PATH/index.html"

          echo "PWA deployment completed"

      # ========================================
      # 8. VERIFY DEPLOYMENT
      # ========================================
      - name: Verify deployed files
        run: |
          set -euo pipefail

          echo "Checking deployed index.html..."
          test -s "$DEPLOY_PATH/index.html"

          echo "Checking deployed assets..."
          test -d "$DEPLOY_PATH/assets"

          echo "Deployment verification successful"

      # ========================================
      # 9. DEPLOYMENT SUMMARY
      # ========================================
      - name: Deployment summary
        if: success()
        run: |
          echo "=================================="
          echo " UDEV PWA DEPLOYMENT SUCCESS"
          echo "=================================="
          echo "Frontend: https://udev.udumbara.my.id"
          echo "Backend : $VITE_API_URL"
          echo "Runner  : homelab-frontend-udev"
          echo "Mode    : PWA"
          echo "=================================="
